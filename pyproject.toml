[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxkuramoto"
version = "0.0.8"
description = "JAX implementation of Kuramoto model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ryosuke Yoneda", email = "13e.e.c.13@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.4.0",
    "distrax>=0.1.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
docs = [
    "jupyter-book>=2.1.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yonesuke/jaxkuramoto"
Documentation = "https://jaxkuramoto.readthedocs.io/"
Repository = "https://github.com/yonesuke/jaxkuramoto.git"

[tool.hatch.build.targets.wheel]
packages = ["jaxkuramoto"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "docs/_build",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731"]  # line length handled by formatter, allow lambda assignment

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
