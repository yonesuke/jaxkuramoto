version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "20"

  jobs:
    pre_build:
      - "jupyter-book config sphinx docs/"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false